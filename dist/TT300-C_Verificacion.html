<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TT300-C Verificación</title>
<style>
:root{
  --bg:#f6f7f9;--panel:#ffffff;--ink:#14171c;--ink2:#4a5260;--line:#d9dde3;--soft:#eef1f4;
  --acc:#1f5fbf;--ok:#1e7d3c;--okbg:#e5f3e9;--warn:#9a6400;--warnbg:#fbf0d9;--fail:#b3261e;--failbg:#fbe4e2;
  --info:#5b6472;--infobg:#eceff3;--pend:#3657a8;--pendbg:#e6ecf8;--steel:#8a94a3;--load:#c2410c;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;--sans:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111418;--panel:#181c22;--ink:#e7eaee;--ink2:#a7b0bd;--line:#2c333d;--soft:#20262e;
  --acc:#6ea8ff;--ok:#5fd08a;--okbg:#173322;--warn:#f0b54a;--warnbg:#3a2d12;--fail:#ff7b72;--failbg:#3d1a18;
  --info:#a7b0bd;--infobg:#242a33;--pend:#8fb0ff;--pendbg:#1d2740;--steel:#7d8796;--load:#fb923c;}}
:root[data-theme="dark"]{
  --bg:#111418;--panel:#181c22;--ink:#e7eaee;--ink2:#a7b0bd;--line:#2c333d;--soft:#20262e;
  --acc:#6ea8ff;--ok:#5fd08a;--okbg:#173322;--warn:#f0b54a;--warnbg:#3a2d12;--fail:#ff7b72;--failbg:#3d1a18;
  --info:#a7b0bd;--infobg:#242a33;--pend:#8fb0ff;--pendbg:#1d2740;--steel:#7d8796;--load:#fb923c;}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.45 var(--sans)}
header{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:5}
header h1{font-size:16px;margin:0;font-weight:650;letter-spacing:.2px}
header .sub{color:var(--ink2);font-size:12px}
.badges{display:flex;flex-wrap:wrap;gap:8px;margin-left:auto}
.badge{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-weight:600;font-size:12.5px;border:1px solid transparent;white-space:nowrap}
.b-ok{background:var(--okbg);color:var(--ok)}.b-fail{background:var(--failbg);color:var(--fail)}.b-warn{background:var(--warnbg);color:var(--warn)}.b-info{background:var(--infobg);color:var(--info)}.b-pend{background:var(--pendbg);color:var(--pend)}
.wrap{display:grid;grid-template-columns:340px 1fr;height:calc(100vh - 56px)}
aside{border-right:1px solid var(--line);overflow:auto;background:var(--panel);padding:10px 12px 40px}
main{overflow:auto;padding:12px 16px 60px;min-width:0}
@media (max-width:980px){.wrap{grid-template-columns:1fr;height:auto}aside{border-right:0;border-bottom:1px solid var(--line);max-height:none}main{overflow:visible}}
details{border:1px solid var(--line);border-radius:8px;margin:8px 0;background:var(--panel)}
summary{cursor:pointer;padding:7px 10px;font-weight:600;font-size:13px;list-style:none;display:flex;justify-content:space-between}
summary::-webkit-details-marker{display:none}
summary::after{content:"▸";color:var(--ink2)}details[open] summary::after{content:"▾"}
.prm{display:grid;grid-template-columns:1fr 92px;gap:4px 8px;align-items:center;padding:3px 10px}
.prm label{font-size:12.5px;color:var(--ink2)}
.prm label .u{color:var(--steel);font-size:11px;margin-left:3px}
.prm input{width:100%;padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:12.5px var(--mono);text-align:right}
.prm input.txt{text-align:left}
.prm.chk{grid-template-columns:1fr 22px;padding:6px 10px;margin:2px 0;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.prm.chk label{color:var(--ink);font-weight:600;cursor:pointer}
.prm.chk input{width:18px;height:18px;padding:0;accent-color:var(--acc);cursor:pointer}
.prm.chk.chg{border-color:var(--acc)}
.prm input:focus{outline:2px solid var(--acc);outline-offset:-1px}
.prm.chg input{border-color:var(--acc)}
.btns{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 4px}
button{font:600 12.5px var(--sans);padding:6px 10px;border-radius:7px;border:1px solid var(--line);background:var(--soft);color:var(--ink);cursor:pointer}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff}
button:disabled{opacity:.5;cursor:default}
nav.tabs{display:flex;flex-wrap:wrap;gap:4px;border-bottom:1px solid var(--line);margin-bottom:12px}
nav.tabs button{border:0;border-bottom:2px solid transparent;border-radius:0;background:none;color:var(--ink2);padding:8px 10px}
nav.tabs button.on{color:var(--ink);border-bottom-color:var(--acc)}
.tab{display:none}.tab.on{display:block}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.card h3{margin:0 0 8px;font-size:13px;color:var(--ink2);font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.big{font-size:26px;font-weight:700;letter-spacing:-.3px}
.kv{display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-size:13px}
.kv span:nth-child(even){font-family:var(--mono);text-align:right}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{padding:5px 7px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--ink2);font-weight:600;background:var(--soft);position:sticky;top:0}
td.n,th.n{text-align:right;font-family:var(--mono);white-space:nowrap}
tr.grp td{background:var(--soft);font-weight:650;color:var(--ink)}
.st{display:inline-block;min-width:68px;text-align:center;padding:1px 6px;border-radius:5px;font-size:11.5px;font-weight:650}
.st-ok{background:var(--okbg);color:var(--ok)}.st-warn{background:var(--warnbg);color:var(--warn)}.st-fail{background:var(--failbg);color:var(--fail)}.st-info{background:var(--infobg);color:var(--info)}.st-pend{background:var(--pendbg);color:var(--pend)}
.fu{position:relative;height:6px;background:var(--soft);border-radius:3px;min-width:70px;margin-top:4px}
.fu i{position:absolute;left:0;top:0;bottom:0;border-radius:3px}
.ref{color:var(--ink2);font-size:11.5px}
.form{font-family:var(--mono);font-size:11.5px;color:var(--ink2)}
.msg{padding:6px 10px;border-radius:7px;margin:4px 0;font-size:12.5px}
.msg.error{background:var(--failbg);color:var(--fail)}.msg.warn{background:var(--warnbg);color:var(--warn)}.msg.ok{background:var(--okbg);color:var(--ok)}
svg{display:block;max-width:100%;height:auto}
svg text{font-family:var(--sans);fill:var(--ink)}
.scroll{overflow:auto}
.note{color:var(--ink2);font-size:12px;margin:6px 0}
.prog{height:6px;background:var(--soft);border-radius:3px;overflow:hidden;margin:8px 0}
.prog i{display:block;height:100%;background:var(--acc);width:0}
.busy{color:var(--ink2);font-size:12px}
</style>
</head>
<body>
<header>
  <div><h1>TT300-C · Verificación de tornamesa hidráulica</h1><div class="sub">Cilindro con patín guiado y uña de cara plana · acero-acero con grasa grafitada · AISC 360-22 (ASD), ASME BTH-1, AWS D1.1</div></div>
  <div class="badges" id="badges"></div>
</header>
<div class="wrap">
  <aside>
    <div class="btns">
      <button class="pri" id="bOpt">Minimizar peso</button>
      <button id="bReset">Valores por defecto</button>
      <button id="bExp">Exportar JSON</button>
      <button id="bImp">Importar JSON</button>
      <button id="bTheme" title="Tema claro / oscuro">◐</button>
    </div>
    <input type="file" id="fImp" accept=".json,application/json" hidden>
    <div class="busy" id="busy"></div>
    <div id="form"></div>
  </aside>
  <main>
    <nav class="tabs" id="tabs"></nav>
    <section class="tab" data-t="resumen" data-l="Resumen"></section>
    <section class="tab" data-t="modelo" data-l="Modelo"></section>
    <section class="tab" data-t="giro" data-l="Accionamiento"></section>
    <section class="tab" data-t="verif" data-l="Verificaciones"></section>
    <section class="tab" data-t="fea" data-l="FEA"></section>
    <section class="tab" data-t="masa" data-l="Masas"></section>
    <section class="tab" data-t="agentes" data-l="Agentes"></section>
    <section class="tab" data-t="opt" data-l="Optimizador"></section>
  </main>
</div>
<script>
/* FEA engine: banded Cholesky, Mindlin plate MITC4, plane-stress Q4. Units N, mm, MPa. */
const FEA = (() => {
  const GP = [-1 / Math.sqrt(3), 1 / Math.sqrt(3)];
  const XI = [-1, 1, 1, -1], ETA = [-1, -1, 1, 1];

  function Band(n, bw) { this.n = n; this.bw = bw; this.W = bw + 1; this.a = new Float64Array(n * (bw + 1)); }
  Band.prototype.add = function (i, j, v) {
    if (j < i) { const t = i; i = j; j = t; }
    const d = j - i;
    if (d > this.bw) throw new Error("bandwidth " + d + ">" + this.bw);
    this.a[i * this.W + d] += v;
  };
  Band.prototype.diag = function (i) { return this.a[i * this.W]; };

  function cholSolve(B, f) {
    const n = B.n, w = B.bw, W = B.W, a = B.a;
    for (let i = 0; i < n; i++) {
      let s = a[i * W];
      for (let k = Math.max(0, i - w); k < i; k++) { const u = a[k * W + (i - k)]; s -= u * u; }
      if (!(s > 0)) throw new Error("Matriz no definida positiva en GDL " + i + " (modelo inestable)");
      const d = Math.sqrt(s); a[i * W] = d;
      const jmax = Math.min(n - 1, i + w);
      for (let j = i + 1; j <= jmax; j++) {
        let t = a[i * W + (j - i)];
        for (let k = Math.max(0, j - w); k < i; k++) t -= a[k * W + (i - k)] * a[k * W + (j - k)];
        a[i * W + (j - i)] = t / d;
      }
    }
    const y = new Float64Array(n);
    for (let i = 0; i < n; i++) {
      let s = f[i];
      for (let k = Math.max(0, i - w); k < i; k++) s -= a[k * W + (i - k)] * y[k];
      y[i] = s / a[i * W];
    }
    const x = new Float64Array(n);
    for (let i = n - 1; i >= 0; i--) {
      let s = y[i];
      const jmax = Math.min(n - 1, i + w);
      for (let j = i + 1; j <= jmax; j++) s -= a[i * W + (j - i)] * x[j];
      x[i] = s / a[i * W];
    }
    return x;
  }

  function shape(xi, eta) {
    const N = [], dxi = [], deta = [];
    for (let i = 0; i < 4; i++) {
      N.push(0.25 * (1 + xi * XI[i]) * (1 + eta * ETA[i]));
      dxi.push(0.25 * XI[i] * (1 + eta * ETA[i]));
      deta.push(0.25 * ETA[i] * (1 + xi * XI[i]));
    }
    return { N, dxi, deta };
  }
  function jac(X, Y, s) {
    let xx = 0, xy = 0, yx = 0, yy = 0;
    for (let i = 0; i < 4; i++) { xx += s.dxi[i] * X[i]; xy += s.dxi[i] * Y[i]; yx += s.deta[i] * X[i]; yy += s.deta[i] * Y[i]; }
    const det = xx * yy - xy * yx;
    const inv = [[yy / det, -xy / det], [-yx / det, xx / det]];
    const dx = [], dy = [];
    for (let i = 0; i < 4; i++) { dx.push(inv[0][0] * s.dxi[i] + inv[0][1] * s.deta[i]); dy.push(inv[1][0] * s.dxi[i] + inv[1][1] * s.deta[i]); }
    return { det, inv, dx, dy, J: [[xx, xy], [yx, yy]] };
  }
  function addBtDB(K, B, D, f, nd) {
    const nr = B.length;
    const DB = [];
    for (let r = 0; r < nr; r++) { DB.push(new Float64Array(nd)); for (let c = 0; c < nd; c++) { let s = 0; for (let k = 0; k < nr; k++) s += D[r][k] * B[k][c]; DB[r][c] = s; } }
    for (let i = 0; i < nd; i++) for (let j = 0; j < nd; j++) { let s = 0; for (let r = 0; r < nr; r++) s += B[r][i] * DB[r][j]; K[i][j] += s * f; }
  }
  const zeros = (n) => Array.from({ length: n }, () => new Float64Array(n));

  /* ---------------- Mindlin plate (MITC4). DOF/node: w, bx, by ---------------- */
  function plateDb(t, E, nu) {
    const D = E * t ** 3 / (12 * (1 - nu * nu));
    return [[D, nu * D, 0], [nu * D, D, 0], [0, 0, D * (1 - nu) / 2]];
  }
  function plateBb(jj) {
    const B = [new Float64Array(12), new Float64Array(12), new Float64Array(12)];
    for (let i = 0; i < 4; i++) {
      B[0][3 * i + 1] = jj.dx[i];
      B[1][3 * i + 2] = jj.dy[i];
      B[2][3 * i + 1] = jj.dy[i]; B[2][3 * i + 2] = jj.dx[i];
    }
    return B;
  }
  function plateKe(X, Y, t, E, nu) {
    const Db = plateDb(t, E, nu);
    const ks = 5 / 6 * E / (2 * (1 + nu)) * t;
    const K = zeros(12);
    for (const xi of GP) for (const eta of GP) {
      const s = shape(xi, eta), jj = jac(X, Y, s);
      addBtDB(K, plateBb(jj), Db, jj.det, 12);
    }
    const row = (xi, eta, dir) => {
      const s = shape(xi, eta);
      const d = dir === 0 ? s.dxi : s.deta;
      let tx = 0, ty = 0;
      for (let i = 0; i < 4; i++) { tx += d[i] * X[i]; ty += d[i] * Y[i]; }
      const r = new Float64Array(12);
      for (let i = 0; i < 4; i++) { r[3 * i] = d[i]; r[3 * i + 1] = s.N[i] * tx; r[3 * i + 2] = s.N[i] * ty; }
      return r;
    };
    const rA = row(0, 1, 0), rC = row(0, -1, 0), rB = row(-1, 0, 1), rD = row(1, 0, 1);
    const Ds = [[ks, 0], [0, ks]];
    for (const xi of GP) for (const eta of GP) {
      const s = shape(xi, eta), jj = jac(X, Y, s);
      const gx = new Float64Array(12), ge = new Float64Array(12);
      for (let c = 0; c < 12; c++) {
        gx[c] = 0.5 * (1 + eta) * rA[c] + 0.5 * (1 - eta) * rC[c];
        ge[c] = 0.5 * (1 + xi) * rD[c] + 0.5 * (1 - xi) * rB[c];
      }
      const Bs = [new Float64Array(12), new Float64Array(12)];
      for (let c = 0; c < 12; c++) {
        Bs[0][c] = jj.inv[0][0] * gx[c] + jj.inv[0][1] * ge[c];
        Bs[1][c] = jj.inv[1][0] * gx[c] + jj.inv[1][1] * ge[c];
      }
      addBtDB(K, Bs, Ds, jj.det, 12);
    }
    return K;
  }

  function bandwidth(elems, ndof) {
    let bw = 0;
    for (const e of elems) { const mn = Math.min(...e), mx = Math.max(...e); bw = Math.max(bw, (mx - mn + 1) * ndof - 1); }
    return bw;
  }

  /* model: {nodes:[[x,y]], elems:[[n1..n4]], t,E,nu, q:Float64Array per elem (MPa, +z),
     wFix:[node], clamp:[node], betaN:[[node,nx,ny]]} */
  function plate(m) {
    const nn = m.nodes.length, n = 3 * nn;
    const bw = bandwidth(m.elems, 3);
    const K = new Band(n, bw), f = new Float64Array(n);
    let maxd = 0;
    for (let e = 0; e < m.elems.length; e++) {
      const en = m.elems[e];
      const X = en.map((k) => m.nodes[k][0]), Y = en.map((k) => m.nodes[k][1]);
      const ke = plateKe(X, Y, m.t, m.E, m.nu);
      const dofs = [];
      for (const k of en) dofs.push(3 * k, 3 * k + 1, 3 * k + 2);
      for (let i = 0; i < 12; i++) for (let j = i; j < 12; j++) {
        const gi = dofs[i], gj = dofs[j];
        if (gi === gj) K.add(gi, gj, ke[i][j]);
        else if (gi < gj) K.add(gi, gj, ke[i][j]);
        else K.add(gj, gi, ke[i][j]);
        if (i === j) maxd = Math.max(maxd, ke[i][i]);
      }
      const q = m.q[e];
      if (q) for (const xi of GP) for (const eta of GP) {
        const s = shape(xi, eta), jj = jac(X, Y, s);
        for (let i = 0; i < 4; i++) f[3 * en[i]] += s.N[i] * q * jj.det;
      }
    }
    // symmetric fill: ensure lower duplicates added only once (handled by i<=j loop with symmetric storage)
    const kp = maxd * 1e6;
    const used = new Uint8Array(nn);
    for (const en of m.elems) for (const k of en) used[k] = 1;
    for (let k = 0; k < nn; k++) if (!used[k]) { K.add(3 * k, 3 * k, 1); K.add(3 * k + 1, 3 * k + 1, 1); K.add(3 * k + 2, 3 * k + 2, 1); }
    for (const k of m.wFix) K.add(3 * k, 3 * k, kp);
    for (const k of (m.clamp || [])) { K.add(3 * k, 3 * k, kp); K.add(3 * k + 1, 3 * k + 1, kp); K.add(3 * k + 2, 3 * k + 2, kp); }
    for (const [k, nx, ny] of (m.betaN || [])) {
      K.add(3 * k + 1, 3 * k + 1, kp * nx * nx); K.add(3 * k + 2, 3 * k + 2, kp * ny * ny); K.add(3 * k + 1, 3 * k + 2, kp * nx * ny);
    }
    const u = cholSolve(K, f);
    const w = new Float64Array(nn);
    for (let k = 0; k < nn; k++) w[k] = u[3 * k];
    const reac = new Float64Array(nn);
    const fixed = new Set([...m.wFix, ...(m.clamp || [])]);
    for (const k of fixed) reac[k] = -kp * u[3 * k];
    const Db = plateDb(m.t, m.E, m.nu);
    const el = [];
    const pts = [[0, 0]].concat(GP.flatMap((a) => GP.map((b) => [a, b])));
    for (let e = 0; e < m.elems.length; e++) {
      const en = m.elems[e];
      const X = en.map((k) => m.nodes[k][0]), Y = en.map((k) => m.nodes[k][1]);
      const ue = []; for (const k of en) ue.push(u[3 * k], u[3 * k + 1], u[3 * k + 2]);
      let vmc = 0, vmx = 0, Mc = null;
      for (let p = 0; p < pts.length; p++) {
        const s = shape(pts[p][0], pts[p][1]), jj = jac(X, Y, s), B = plateBb(jj);
        const kap = [0, 0, 0];
        for (let r = 0; r < 3; r++) for (let c = 0; c < 12; c++) kap[r] += B[r][c] * ue[c];
        const M = [0, 0, 0];
        for (let r = 0; r < 3; r++) for (let c = 0; c < 3; c++) M[r] += Db[r][c] * kap[c];
        const k6 = 6 / (m.t * m.t);
        const sx = M[0] * k6, sy = M[1] * k6, txy = M[2] * k6;
        const vm = Math.sqrt(sx * sx - sx * sy + sy * sy + 3 * txy * txy);
        if (p === 0) { vmc = vm; Mc = M; } else vmx = Math.max(vmx, vm);
      }
      el.push({ vm: vmc, vmGauss: vmx, M: Mc });
    }
    let F = 0; for (let k = 0; k < nn; k++) F += f[3 * k];
    let R = 0; for (const k of fixed) R += reac[k];
    return { w, reac, el, Fapplied: F, Rsum: R, ndof: n, bw };
  }

  /* ---------------- Plane stress Q4. DOF/node: ux, uy ---------------- */
  function psD(E, nu) { const c = E / (1 - nu * nu); return [[c, c * nu, 0], [c * nu, c, 0], [0, 0, c * (1 - nu) / 2]]; }
  function psB(jj) {
    const B = [new Float64Array(8), new Float64Array(8), new Float64Array(8)];
    for (let i = 0; i < 4; i++) { B[0][2 * i] = jj.dx[i]; B[1][2 * i + 1] = jj.dy[i]; B[2][2 * i] = jj.dy[i]; B[2][2 * i + 1] = jj.dx[i]; }
    return B;
  }
  /* m: {nodes, elems, t, E, nu, fix:[[node,dof]], loads:[[node,fx,fy]]} */
  function planeStress(m) {
    const nn = m.nodes.length, n = 2 * nn, bw = bandwidth(m.elems, 2);
    const K = new Band(n, bw), f = new Float64Array(n), D = psD(m.E, m.nu);
    let maxd = 0;
    for (const en of m.elems) {
      const X = en.map((k) => m.nodes[k][0]), Y = en.map((k) => m.nodes[k][1]);
      const ke = zeros(8);
      for (const xi of GP) for (const eta of GP) { const s = shape(xi, eta), jj = jac(X, Y, s); addBtDB(ke, psB(jj), D, jj.det * m.t, 8); }
      const dofs = []; for (const k of en) dofs.push(2 * k, 2 * k + 1);
      for (let i = 0; i < 8; i++) for (let j = i; j < 8; j++) K.add(dofs[i], dofs[j], ke[i][j]);
      for (let i = 0; i < 8; i++) maxd = Math.max(maxd, ke[i][i]);
    }
    const used = new Uint8Array(nn);

    let vmMax = 0, imax = 0;
    r.el.forEach((e, i) => { if (e.vmGauss > vmMax) { vmMax = e.vmGauss; imax = i; } });
    let wMax = 0; for (const w of r.w) wMax = Math.max(wMax, Math.abs(w));
    const sumS = (arr) => Math.abs(arr.reduce((s, k) => s + r.reac[k], 0));   // suma con signo (rev. m3)
    const ringLine = m.rings.map((rr, i) => sumS(m.groups.ring[i]) / (rr * m.alpha));   // N/mm
    const ribF = sumS(m.groups.rib), ribLine = ribF / (2 * Math.max(1, P.R_rib - P.D_hub / 2));   // N/mm, 2 bordes del sector = 1 nervio
    const pinF = m.groups.pin.map((g) => sumS(g) / 1e3);
    const ec = m.elems[imax].map((k) => m.nodes[k]);
    const cx = ec.reduce((s, p) => s + p[0], 0) / 4, cy = ec.reduce((s, p) => s + p[1], 0) / 4;
    return { model: m, res: r, ms, vmMax, wMax, ringLine, ribLine, pinF, lineMax: Math.max(0, ribLine, ...ringLine),
      Fapp: r.Fapplied / 1e3, Rsum: Math.abs(r.Rsum) / 1e3, maxAt: [Math.hypot(cx, cy), Math.atan2(cy, cx) / D2R], n: m.nodes.length };
  }

  /* ---------------- Flexión global axisimétrica del cajón (placa sándwich, borde libre) ---------------- */
  function globalBending(P, R) {
    const n = 4000, Rd = P.D_top / 2, RL = Math.min(P.D_load / 2, Rd), Ri = R.Ri;
    const qt = P.phi_d * R.W * 1e3 / (Math.PI * RL * RL), qd = R.Wd * 1e3 / (Math.PI * Rd * Rd);
    const qb = R.ND * 1e3 / (Math.PI * (Rd * Rd - Ri * Ri));
    const r = new Float64Array(n), p = new Float64Array(n);
    for (let i = 0; i < n; i++) {
      r[i] = 1e-6 + Rd * i / (n - 1);
      p[i] = (r[i] >= Ri ? qb : 0) - (r[i] <= RL ? qt : 0) - qd;
    }
    const cum = new Float64Array(n), Q = new Float64Array(n);
    for (let i = 1; i < n; i++) cum[i] = cum[i - 1] + 0.5 * (p[i] * r[i] + p[i - 1] * r[i - 1]) * (r[i] - r[i - 1]);
    for (let i = 0; i < n; i++) Q[i] = cum[i] / r[i];
    const Iq = new Float64Array(n), J = new Float64Array(n);
    for (let i = 1; i < n; i++) Iq[i] = Iq[i - 1] + 0.5 * (Q[i] + Q[i - 1]) * (r[i] - r[i - 1]);
    for (let i = 1; i < n; i++) J[i] = J[i - 1] + 0.5 * (Iq[i] * r[i] + Iq[i - 1] * r[i - 1]) * (r[i] - r[i - 1]);
    const psi = new Float64Array(n), dps = new Float64Array(n);
    for (let i = 0; i < n; i++) psi[i] = J[i] / r[i];
    for (let i = 1; i < n - 1; i++) dps[i] = (psi[i + 1] - psi[i - 1]) / (r[i + 1] - r[i - 1]);
    dps[0] = dps[1]; dps[n - 1] = dps[n - 2];
    const C = -(dps[n - 1] + P.nu * psi[n - 1] / Rd) / (1 + P.nu);
    let Mmax = 0, rM = 0, Vmax = 0, rV = 0;
    for (let i = 5; i < n - 5; i++) {
      const ps = psi[i] + C * r[i], dp = dps[i] + C;
      const Mr = dp + P.nu * ps / r[i], Mt = ps / r[i] + P.nu * dp;
      const M = Math.max(Math.abs(Mr), Math.abs(Mt));
      if (M > Mmax) { Mmax = M; rM = r[i]; }
      if (r[i] >= P.D_hub / 2 && r[i] <= P.R_rib) {
        const V = Math.abs(Q[i]) * 2 * Math.PI * r[i];
        if (V > Vmax) { Vmax = V; rV = r[i]; }
      }
    }
    const hc = P.h_disc - (P.t_top + P.t_bot) / 2;
    const imb = Q[n - 1] * 2 * Math.PI * Rd / 1e3;
    return { Mmax, rM, sigTop: Mmax / (P.t_top * hc), sigBot: Mmax / (P.t_bot * hc), Vmax: Vmax / 1e3, rV, imbalance: imb };
  }

  /* ---------------- FEA de izaje de la base (cuarto de placa con simetría) ---------------- */
  function runLift(P, R, coarse) {
    const a = P.B / 2, n = coarse ? 14 : 24, h = a / n;
    const nodes = [], elems = [];
    for (let i = 0; i <= n; i++) for (let j = 0; j <= n; j++) nodes.push([i * h, j * h]);
    const id = (i, j) => i * (n + 1) + j;
    const Rd = P.D_top / 2;
    const mOther = R.m.disc + R.m.pivot + R.m.dogs + R.m.cyl;            // apoyado sobre la huella de la mesa
    const qDisc = mOther * G / (Math.PI * Rd * Rd);
    const qOwn = (R.m.base + R.m.rim + R.m.brackets) * G / (P.B * P.B);
    const q = [];
    for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
      elems.push([id(i, j), id(i + 1, j), id(i + 1, j + 1), id(i, j + 1)]);
      const xc = (i + 0.5) * h, yc = (j + 0.5) * h;
      q.push(P.phi_lift * (qOwn + (Math.hypot(xc, yc) <= Rd ? qDisc : 0)));
    }
    // puntos de izaje en los lados y: (±x_lug, ±(B/2 − c)); cuarto de placa con simetría en x = 0 e y = 0
    const xl = Math.min(P.x_lug, a - 1), yl = a - P.c_lug, pad = Math.max(75, 1.01 * h);   // placa de apoyo 150 × 150 (mín. un elemento)
    const wFix = [], betaN = [];
    for (let i = 0; i <= n; i++) for (let j = 0; j <= n; j++) {
      const k = id(i, j), x = i * h, y = j * h;
      if (Math.abs(x - xl) <= pad + 1e-6 && Math.abs(y - yl) <= pad + 1e-6) wFix.push(k);
      if (i === 0) betaN.push([k, 1, 0]);
      if (j === 0) betaN.push([k, 0, 1]);
    }
    if (!wFix.length) { let best = 0, bd = 1e9; nodes.forEach((p, k) => { const d = Math.hypot(p[0] - xl, p[1] - yl); if (d < bd) { bd = d; best = k; } }); wFix.push(best); }
    const t0 = now();
    const r = FEA_.plate({ nodes, elems, t: P.t_base, E: P.E, nu: P.nu, q: Float64Array.from(q), wFix, betaN });
    let vmMax = 0, wMax = 0;
    r.el.forEach((e) => { vmMax = Math.max(vmMax, e.vmGauss); });
    for (const w of r.w) wMax = Math.max(wMax, Math.abs(w));
    return { nodes, elems, res: r, vmMax, wMax, ms: now() - t0, Fapp: 4 * r.Fapplied / 1e3, Rsum: 4 * Math.abs(r.Rsum) / 1e3, n };
  }

  /* ---------------- Fatiga: AISC 360-22 Apéndice 3, Tabla A-3.1 (SI) ---------------- */
  // Cf en unidades US (ksi) según la tabla; F_SR[MPa] = 6,895·(Cf/n)^(1/k); F_TH en MPa
  const FAT_CAT = { A: [250e8, 165, 3], B: [120e8, 110, 3], C: [44e8, 69, 3], D: [22e8, 48, 3], E: [11e8, 31, 3], "E'": [3.9e8, 18, 3], F: [150e10, 55, 6] };
  function FSR(cat, nCyc) { const [Cf, Fth, k] = FAT_CAT[cat]; return Math.max(6.895 * Math.pow(Cf / Math.max(nCyc, 1), 1 / k), Fth); }

  /* ---------------- Verificaciones ---------------- */
  // kind: "fu" (FU = dem/cap), "geo" (FU con criterio geométrico), "info" (no afecta el veredicto), "pend" (pendiente de dato)
  function verifs(P, R, fea) {
    const out = [];
    const add = (o) => out.push(Object.assign({ kind: "fu" }, o, { fu: o.kind === "info" || o.kind === "pend" ? null : (o.fu != null ? o.fu : o.dem / o.cap) }));
    const K = R.K, Nd = P.Nd, Fy = P.Fy;
    const Fs = R.Fstall;                                   // fuerza de calado por cilindro, kN
    const cd = R.cd || { F: NaN, p: NaN, FS: NaN };
    const cs = (id) => R.cases.find((c) => c.id === id) || { F: NaN, FS: NaN, p: NaN };
    const Fw = (P.FEXX * 0.60) / (1.20 * Nd);              // BTH-1 soldaduras
    const FwA = 0.60 * P.FEXX / 2.0;                       // AISC J2.4 ASD (Ω 2,00), sin aumento direccional

    /* --- Giro --- */
    add({ grp: "Giro", sys: "giro", name: "FS del accionamiento en el caso de diseño", formula: "FS = F_calado / F_dis ≥ FS_min", dem: P.FS_min, cap: cd.FS, unit: "–", ref: "Criterio del proyecto (μ_d, r_ef)" });
    add({ grp: "Giro", sys: "giro", name: "Presión de diseño frente a la alarma", formula: "p_dis = F_dis / A ≤ p_alarma", dem: cd.p, cap: P.p_alarm, unit: "bar", ref: "Criterio de operación" });
    const pRatedBar = P.p_rated * PSI_CAT;
    add({ grp: "Giro", sys: "giro", name: "Alivio dentro de la presión nominal del cilindro y la bomba", formula: "p_alivio ≤ p_nominal (10.000 psi ≙ 700 bar; 5.000 psi ≙ 350 bar)", dem: P.p_relief, cap: pRatedBar, unit: "bar", ref: "ISO 4413:2010, protección contra sobrepresión; catálogo del fabricante" });
    add({ grp: "Giro", sys: "giro", name: "Alarma bajo el alivio (detiene antes de calar)", formula: "p_alarma ≤ 0,90 · p_alivio", dem: P.p_alarm, cap: 0.9 * P.p_relief, unit: "bar", ref: "Criterio de operación" });
    add({ grp: "Giro", sys: "giro", name: "Retorno dentro de la presión nominal", formula: "p_retorno ≤ p_nominal", dem: P.p_ret, cap: pRatedBar, unit: "bar", ref: "Catálogo del fabricante" });
    const Dreq = (pr, pa) => Math.sqrt(4 / Math.PI * Math.max(P.FS_min * cd.F * 1e3 / (pr / 10), cd.F * 1e3 / (pa / 10)));
    add({ grp: "Giro", sys: "giro", kind: "info", name: "Émbolo mínimo con las presiones elegidas", formula: "A ≥ máx(FS_min·F_dis/p_alivio; F_dis/p_alarma)", dem: Dreq(P.p_relief, P.p_alarm), cap: P.D_bore, unit: "mm", ref: "Hidráulica" });
    add({ grp: "Giro", sys: "giro", name: "Gira con grasa contaminada", formula: "F_cont ≤ F_calado", dem: cs("cont").F, cap: Fs, unit: "kN", ref: "Criterio del proyecto" });
    add({ grp: "Giro", sys: "giro", name: "Gira con contacto en el borde (r = R)", formula: "F(μ_d, R) ≤ F_calado", dem: cs("borde").F, cap: Fs, unit: "kN", ref: "Revisión independiente M1" });
    add({ grp: "Giro", sys: "giro", kind: "geo", name: "Carrera requerida con margen", formula: "s_libre + ΔL(paso) + margen ≤ carrera", dem: K.ok ? K.s_req + P.s_margin : NaN, cap: P.stroke, unit: "mm", ref: "Cinemática (rev. C3)" });
    const bgv = bracketGeo(P), Bh = P.B / 2 - P.rim_t - 5, zBed = P.t_base + P.t_bed;
    add({ grp: "Giro", sys: "giro", kind: "geo", name: "Uña entre pasadores (ancho en el sentido del empuje)", formula: "cuerda − d_pas ≥ b_uña + 2·10", dem: P.dog_b + 20, cap: K.gap, unit: "mm", ref: "Cinemática" });
    add({ grp: "Giro", sys: "giro", kind: "geo", name: "Uña dentro de la luz libre entre anillos", formula: "h_uña + 10 ≤ h − 2·t_anillo", dem: P.dog_h + 10, cap: pinClear(P), unit: "mm", ref: "Geometría" });
    if (K.inset > 0) add({ grp: "Giro", sys: "giro", kind: "geo", name: "Boca del alojamiento entre los anillos de la mesa", formula: "h_uña + 2·10 (marco) + 10 ≤ h − 2·t_anillo", dem: P.dog_h + 30, cap: pinClear(P), unit: "mm", ref: "Geometría (alzado)" });
    add({ grp: "Giro", sys: "giro", kind: "geo", name: "Alojamiento de la uña (retorno + resorte) dentro del patín", formula: "boca + L_in + recorrido de retorno + resorte + 10 ≤ x_g + w_s/2", dem: K.pocketEnd + 10, cap: P.x_g + P.w_s / 2, unit: "mm", ref: "Geometría (retorno del trinquete)" });
    add({ grp: "Giro", sys: "giro", kind: "geo", name: "Holgura radial de la uña en el patín", formula: "R·(1 − cos π/N) + 2 ≤ holgura", dem: K.radial + 2, cap: P.slot, unit: "mm", ref: "Cinemática (rev. C2)" });
    add({ grp: "Giro", sys: "giro", kind: "geo", name: "Patín fuera de la mesa", formula: "D/2 + 15 ≤ x_g − w_s/2", dem: P.D_top / 2 + 15, cap: P.x_g - P.w_s / 2, unit: "mm", ref: "Geometría (planta)" });
    add({ grp: "Giro", sys: "giro", kind: "geo", name: "Bancada de guía fuera de la mesa", formula: "D/2 + 10 ≤ x_g − w_bancada/2", dem: P.D_top / 2 + 10, cap: P.x_g - P.w_bed / 2, unit: "mm", ref: "Geometría (planta)" });
    add({ grp: "Giro", sys: "giro", kind: "geo", name: "Cilindro, ménsula y bancada dentro de la base (x)", formula: "x_g + máx(D_cuerpo, W_ménsula, w_bancada, w_patín)/2 ≤ B/2 − t_marco − 5", dem: P.x_g + Math.max(P.D_body, bgv.Wout, P.w_bed, P.w_s) / 2, cap: Bh, unit: "mm", ref: "Geometría (planta)" });
    add({ grp: "Giro", sys: "giro", kind: "geo", name: "Ménsula del ojal dentro de la base (y)", formula: "|y_ojal| + saliente trasera ≤ B/2 − t_marco − 5", dem: Math.abs(K.y_eye) + bgv.rear, cap: Bh, unit: "mm", ref: "Geometría (planta)" });
    add({ grp: "Giro", sys: "giro", kind: "geo", name: "Cuerpo del cilindro detrás del patín", formula: "saliente trasera del patín + 10 ≤ c_vástago", dem: K.rear + 10, cap: P.c_rod, unit: "mm", ref: "Geometría (cilindro retraído)" });
    add({ grp: "Giro", sys: "giro", kind: "geo", name: "Fondo del alojamiento de la uña sobre la bancada", formula: "z_eje − h_uña/2 − 1 − z_bancada ≥ t_alojamiento", dem: P.t_pk, cap: K.zc0 - P.dog_h / 2 - 1 - zBed, unit: "mm", ref: "Geometría (alzado)" });
    add({ grp: "Giro", sys: "giro", kind: "geo", name: "Patín bajo la cara superior de la mesa", formula: "z_sup_patín ≤ z_eje + h_mesa/2", dem: K.shoeTop, cap: K.zc0 + P.h_disc / 2, unit: "mm", ref: "Geometría (alzado)" });
    add({ grp: "Giro", sys: "giro", kind: "geo", name: "Horquilla del patín sobre la bancada", formula: "z_bancada + 5 ≤ z_eje − h_horquilla/2", dem: zBed + 5, cap: K.zc0 - forkH(P) / 2, unit: "mm", ref: "Geometría (alzado)" });
    add({ grp: "Giro", sys: "giro", kind: "geo", name: "Orejas de la ménsula libres del cuerpo del cilindro", formula: "d_pp/2 + 25 + 10 ≤ e_cuerpo", dem: TT_lugF(P) + 10, cap: P.e_body, unit: "mm", ref: "Geometría" });
    add({ grp: "Giro", sys: "giro", kind: "geo", name: "Cuerpo del cilindro libre sobre la base", formula: "D_cuerpo/2 + 5 ≤ h_eje", dem: P.D_body / 2 + 5, cap: R.hax, unit: "mm", ref: "Geometría" });
    const Ir = Math.PI * P.d_rod ** 4 / 64, Lext = P.L0 + P.stroke;
    const Pcr = Math.PI ** 2 * P.E * Ir / (Lext * Lext) / 1e3;
    add({ grp: "Giro", sys: "giro", name: "Pandeo del vástago (biarticulado, longitud extendida)", formula: "F_calado ≤ Pcr / 3; Pcr = π²EI/L²", dem: Fs, cap: Pcr / 3, unit: "kN", ref: "Euler, FS 3 (conservador frente a ISO/TS 13725)" });
    add({ grp: "Giro", sys: "giro", kind: "info", name: "Retorno: fuerza disponible en el puerto B", formula: "F_ret = A_anular · p_ret", dem: R.Fret, unit: "kN", ref: "Hidráulica" });
    add({ grp: "Giro", sys: "giro", kind: "info", name: "Tiempo por vuelta", formula: "N_pas · (V_ext + V_ret) / Q", dem: R.tRev, unit: "min", ref: "Hidráulica" });

    /* --- Interfaz y apoyo --- */
    add({ grp: "Interfaz", sys: "est", name: "Presión de contacto máxima", formula: "q = N_D/A · (1 + 4eR/(R²+r²))", dem: R.q_max, cap: P.q_adm, unit: "MPa", ref: "Criterio acero/acero lubricado" });
    add({ grp: "Interfaz", sys: "est", kind: "geo", name: "Sin despegue de la mesa (q_mín ≥ 0)", formula: "1 − 4eR/(R²+r²) ≥ 0", dem: 4 * P.e * R.Ro / (R.Ro ** 2 + R.Ri ** 2), cap: 1, unit: "–", ref: "Núcleo central" });
    add({ grp: "Interfaz", sys: "est", kind: "info", name: "Presión sobre losa / mats bajo la mesa (base delgada, sin reparto)", formula: "σ ≈ q_max ≤ q_losa (verificar por terceros)", dem: R.q_max, cap: P.q_floor, unit: "MPa", ref: "Referencial (rev. M7)" });

    /* --- Interfaz con discos de acero inoxidable (A) o discos + lámina UHMW (B) --- */
    const I = R.ifc;
    if (I.o > 0) {
      const REFD = "Timoshenko y Woinowsky-Krieger, Theory of Plates and Shells §16 (placa circular empotrada, carga uniforme); 0,6Fy (AISC 360-22 F11, criterio del proyecto)";
      const tEnd = I.tss - P.ss_allow;                                       // espesor útil al final de la vida (sin sobreespesor)
      add({ grp: "Interfaz inox", sys: "est", name: "Disco inoxidable: flexión sobre un vacío local (placa empotrada, carga uniforme)", formula: "σ = 3·q·a²/(4·t²) ≤ 0,6·Fy_inox; a = Ø_vacío/2; t = t_disco − sobreespesor", dem: 0.75 * I.q * (I.a / tEnd) ** 2, cap: I.sad, unit: "MPa", ref: REFD });
      add({ grp: "Interfaz inox", sys: "est", kind: "geo", name: "Disco inoxidable: espesor adoptado frente al requerido", formula: "t_disco ≥ máx(t_flex + sobreespesor; t_mínimo constructivo)", dem: I.tssReq, cap: I.tss, unit: "mm", ref: "Cálculo de espesor (flexión sobre vacío local, desgaste y relapeado, fabricación)" });
      add({ grp: "Interfaz inox", sys: "est", kind: "info", name: "Disco inoxidable: espesor mínimo por flexión sobre el vacío local", formula: "t_flex = a·√(0,75·q_máx/(0,6·Fy_inox))", dem: I.tFlex, unit: "mm", ref: REFD });
      add({ grp: "Interfaz inox", sys: "est", kind: "info", name: "Disco inoxidable: espesor requerido / comercial adoptado (cada disco)", formula: "t_req = máx(t_flex + sobreespesor; t_mín); espesores comerciales de plancha ASTM A240", dem: I.tssReq, cap: I.tss, unit: "mm", ref: "ASTM A240 (plancha inoxidable)" });
      const Ttot = R.Tmax, Tret = P.mu_back * R.N * R.r_u / 1e3 + P.tau_bond * R.Ac * R.r_u / 1e6;
      add({ grp: "Interfaz inox", sys: "giro", name: "Retención de los discos sobre su plancha de respaldo (fricción más pegado)", formula: "T_calado ≤ μ_respaldo·N·r_u + τ_adhesivo·A·r_u (los pasadores no bastan: 656 kN·m exigen ≈ 1 m de borde en aplastamiento)", dem: Ttot, cap: Tret, unit: "kN·m", ref: "Equilibrio; respaldo granallado sin pintura; adhesivo epóxico estructural" });
      const dr = (AL_SS - AL_S) * P.dT * R.Ro, sth = E_SS * (AL_SS - AL_S) * P.dT;
      add({ grp: "Interfaz inox", sys: "est", name: "Dilatación diferencial inox–acero: tensión si el disco quedara restringido", formula: "σ = E_inox·(α_inox − α_acero)·ΔT ≤ 0,6·Fy_inox", dem: sth, cap: I.sad, unit: "MPa", ref: "Termoelasticidad; α inox 17,3 y acero 11,7 (×10⁻⁶/K)" });
      add({ grp: "Interfaz inox", sys: "est", kind: "info", name: "Dilatación diferencial radial del disco respecto de su respaldo (fijar el disco solo al centro y con pasadores radiales)", formula: "Δr = (α_inox − α_acero)·ΔT·R", dem: dr, unit: "mm", ref: "Termoelasticidad" });
      add({ grp: "Interfaz inox", sys: "est", kind: "info", name: "Altura que agrega la interfaz sobre la plancha base", formula: I.o === 2 ? "Δ = 2·t_disco + t_UHMW" : "Δ = 2·t_disco", dem: I.delta, unit: "mm", ref: "Geometría (eje de los cilindros sube Δ)" });
      if (I.o === 1) add({ grp: "Interfaz inox", sys: "est", kind: "pend", name: "Opción A: par inox–inox con riesgo de gripado si la película de grasa se expulsa: exigir aleaciones o durezas distintas (≥ 50 HB de diferencia) o recubrimiento", formula: "Sin verificación numérica (ASTM G98)", dem: 0, unit: "–", ref: "ASTM G98; decisión del proyectista" });
      add({ grp: "Interfaz inox", sys: "est", kind: "info", name: "Masa agregada por la interfaz (discos inoxidables + lámina UHMW)", formula: "m = ρ·A·t", dem: R.m.ss + R.m.uhmw, unit: "kg", ref: "Geometría" });
    }
    if (I.o === 2) {
      const REFU = "Proveedor de UHMW-PE (datos de catálogo, ASTM D4020); confirmar con ensayo";
      add({ grp: "Interfaz inox", sys: "est", name: "Lámina UHMW: presión de contacto máxima frente a la admisible sostenida", formula: "q_máx ≤ p_adm,UHMW", dem: I.q, cap: P.p_uhmw, unit: "MPa", ref: REFU });
      add({ grp: "Interfaz inox", sys: "est", kind: "geo", name: "Lámina UHMW: espesor adoptado frente al requerido", formula: "t ≥ máx(E_ap·δ_planitud/(p_adm − q_máx); t_mín constructivo)", dem: I.tuhReq, cap: I.tuh, unit: "mm", ref: REFU });
      add({ grp: "Interfaz inox", sys: "est", kind: "info", name: "Lámina UHMW: espesor por conformidad de planitud (con módulo confinado) / comercial adoptado", formula: "t_conf = E_c(S)·δ/(p_adm − q_máx); E_c = E[1 + (M/E − 1)S²/(1 + S²)], S = D/(4t), M = E(1−ν)/((1+ν)(1−2ν)), ν = 0,45", dem: I.tuhConf, cap: I.tuh, unit: "mm", ref: REFU });
      add({ grp: "Interfaz inox", sys: "est", kind: "info", name: "Lámina UHMW: factor de forma y módulo confinado en el espesor adoptado", formula: "S = D/(4t); E_c(S)", dem: I.SU, cap: I.EcU, unit: "– / MPa", ref: REFU });
      add({ grp: "Interfaz inox", sys: "est", kind: "pend", name: "Opción B: retención de los sectores de UHMW contra el arrastre por fricción (rebaje perimetral o cola de milano en el disco de la base)", formula: "arrastre ≈ μ·N (los pernos no bastan: aplastamiento del UHMW)", dem: R.mu.d * R.N, unit: "kN", ref: "Equilibrio; decisión del proyectista" });
      const vcyl = P.Q_pump * 1e6 / 60 / (P.n_cyl * R.A);                          // mm/s, velocidad del vástago
      const vmax = R.Ro / R.K.armMin * vcyl / 1000;                                 // m/s en el borde de la mesa durante la carrera
      add({ grp: "Interfaz inox", sys: "est", name: "Lámina UHMW: valor PV en el borde de la mesa (durante la carrera)", formula: "PV = q_máx·v; v = R·v_cil/a_mín, v_cil = Q/(n·A)", dem: I.q * vmax, cap: P.PV_uh, unit: "MPa·m/s", ref: REFU });
      const dist = P.life * P.turns_yr * 2 * Math.PI * P.r_ef / 1000;              // m deslizados en la vida
      const wear = P.k_wear * 1e-7 * I.q * dist;                                   // mm
      add({ grp: "Interfaz inox", sys: "est", name: "Lámina UHMW: desgaste en la vida de diseño frente al 20 % del espesor", formula: "h = k·q_máx·s ≤ 0,20·t; s = vida·vueltas/año·2π·r_ef", dem: wear, cap: 0.2 * I.tuh, unit: "mm", ref: REFU });
      const gap = (AL_UH - AL_S) * P.dT * 2 * R.Ro * Math.sin(Math.PI / P.n_seg);
      add({ grp: "Interfaz inox", sys: "est", kind: "info", name: "Lámina UHMW: crecimiento radial del sector (fijar al centro con agujeros ranurados)", formula: "Δr = (α_UHMW − α_acero)·ΔT·R", dem: (AL_UH - AL_S) * P.dT * R.Ro, unit: "mm", ref: REFU });
      add({ grp: "Interfaz inox", sys: "est", kind: "info", name: "Lámina UHMW: junta de dilatación entre sectores (ancho a dejar en frío)", formula: "j = (α_UHMW − α_acero)·ΔT·cuerda del sector; α_UHMW = 180×10⁻⁶/K", dem: gap, unit: "mm", ref: REFU });
    }

    /* --- Mesa --- */
    const sAll = 0.6 * Fy;
    if (fea) {
      const k = P.kFEA;
      add({ grp: "Mesa (FEA)", sys: "est", name: "Plancha superior: σvm local (carga con e)", formula: "MITC4 × k_malla", dem: fea.top.vmMax * k, cap: sAll, unit: "MPa", ref: "AISC 360-22 F11 (0,6Fy), criterio conservador" });
      add({ grp: "Mesa (FEA)", sys: "est", name: "Plancha inferior: σvm local (contacto q_max)", formula: "MITC4 × k_malla", dem: fea.bot.vmMax * k, cap: sAll, unit: "MPa", ref: "AISC 360-22 F11 (0,6Fy), criterio conservador" });
      const gb = fea.glob;
      add({ grp: "Mesa", sys: "est", name: "Plancha superior: global + local", formula: "σ = M_glob/(t·h_c) + σvm_local", dem: gb.sigTop + fea.top.vmMax * k, cap: sAll, unit: "MPa", ref: "Placa sándwich axisimétrica (rev. M2)" });
      add({ grp: "Mesa", sys: "est", name: "Plancha inferior: global + local", formula: "σ = M_glob/(t·h_c) + σvm_local", dem: gb.sigBot + fea.bot.vmMax * k, cap: sAll, unit: "MPa", ref: "Placa sándwich axisimétrica (rev. M2)" });
      const hw = P.h_disc - P.t_top - P.t_bot;
      const tau = gb.Vmax * 1e3 / (P.N_rib * P.t_rib * hw);
      const lam = hw / P.t_rib, lamLim = 2.24 * Math.sqrt(P.E / Fy);
      add({ grp: "Mesa", sys: "est", name: "Corte en nervios radiales", formula: "τ = V/(N·t·h_w) ≤ 0,6Fy/1,50 (h/t ≤ 2,24√(E/Fy))", dem: tau, cap: 0.6 * Fy / (lam <= lamLim ? 1.50 : 1.67), unit: "MPa", ref: "AISC 360-22 G2.1(a), Ec. G2-1" });
      const qv = Math.max(fea.top.lineMax, fea.bot.lineMax);
      const qh = gb.Vmax * 1e3 / (P.N_rib * hw);
      const fw = Math.hypot(qh, qv) / (2 * 0.707 * P.w_web);
      add({ grp: "Mesa", sys: "est", name: "Soldadura alma/nervio–plancha (2 filetes)", formula: "f = √(q_h² + q_v²)/(2·0,707·w) ≤ 0,6FEXX/2,0", dem: fw, cap: FwA, unit: "MPa", ref: "AISC 360-22 J2.4, Ec. J2-4" });
      add({ grp: "Mesa", sys: "est", name: "Fluencia local de almas por carga de línea", formula: "σ = q_v / t ≤ Fy/1,50", dem: qv / Math.min(P.t_web, P.t_rib), cap: Fy / 1.5, unit: "MPa", ref: "AISC 360-22 J10.2" });
      add({ grp: "Mesa (FEA)", sys: "est", kind: "geo", name: "Equilibrio FEA (ΣF = ΣR)", formula: "|ΣF − ΣR| / ΣF ≤ 0,5 %", dem: Math.abs(fea.bot.Fapp - fea.bot.Rsum) / fea.bot.Fapp * 100 + 0.0001, cap: 0.5, unit: "%", ref: "Control numérico" });
    }

    /* --- Tamaño mínimo de filete según espesor de la parte más gruesa --- */
    const wMin = (T) => T <= 6 ? 3 : T <= 12 ? 5 : T <= 20 ? 6 : 8;
    add({ grp: "Base", sys: "est", kind: "geo", name: "Espesor de la plancha base frente al mínimo por planitud", formula: "t_base_mín ≤ t_base", dem: P.t_base_min, cap: P.t_base, unit: "mm", ref: "Criterio de fabricación (planitud 0,20 de la cara de giro)" });
    const Tw = Math.max(P.t_top, P.t_bot), Tb = Math.max(P.t_base, P.t_ch);
    add({ grp: "Soldaduras", sys: "est", kind: "geo", name: "Filete mínimo almas/nervios–planchas", formula: "w_mín(T = " + Tw + ") ≤ w ≤ t_alma", dem: wMin(Tw), cap: Math.min(P.w_web, Math.min(P.t_web, P.t_rib)), unit: "mm", ref: "AWS D1.1/D1.1M:2020, tamaño mínimo de filete" });
    add({ grp: "Soldaduras", sys: "est", kind: "geo", name: "Filete mínimo mejillas–base", formula: "w_mín(T = " + Tb + ") ≤ w ≤ t_mín", dem: wMin(Tb), cap: Math.min(P.w_br, Math.min(P.t_base, P.t_ch)), unit: "mm", ref: "AWS D1.1/D1.1M:2020, tamaño mínimo de filete" });

    /* --- Pasadores de empuje (cadena de empuje a fuerza de calado) --- */
    const tpr = Math.max(P.t_pr, P.t_top, P.t_bot), Ls = P.h_disc - tpr;
    const Fpr = Fs * Math.hypot(1, P.mu_s);                             // resultante con la fricción radial de la cara de la uña
    // Carga repartida en la altura de la uña (c = h_uña), centrada en la luz con excentricidad accidental e.
    // Pasador biapoyado en los anillos: el empotramiento que puede dar el agujero del anillo (aplastamiento sobre el espesor t,
    // descontado el corte) es una fracción menor del perfecto y no se cuenta; se informa como referencia.
    const c = Math.min(P.dog_h, Ls), Vp = Fpr * (0.5 + P.e_dog / Ls);                       // kN
    const Mss = Fpr / 4 * (Ls - c / 2) / 1e3, Mfix = Fpr * (3 * Ls * Ls - c * c) / (24 * Ls) / 1e3;   // kN·m
    const sbA = 1.25 * Fy / Nd, sV = Vp * 1e3 / (P.d_pin * tpr);
    const Me = Math.max(0, Math.min(Mfix, (sbA - sV) * P.d_pin * tpr * tpr / 6 / 1e6));
    const Mp = Mss;
    const Sp = Math.PI * P.d_pin ** 3 / 32, Ap = Math.PI * P.d_pin ** 2 / 4;
    add({ grp: "Pasadores de empuje", sys: "est", name: "Flexión (biapoyado entre anillos, carga repartida en la altura de la uña)", formula: "M = F_r·(L − c/2)/4, c = h_uña, F_r = F·√(1 + μ_s²); σ = M/S ≤ Fy/Nd", dem: Mp * 1e6 / Sp, cap: P.Fy_pin / Nd, unit: "MPa", ref: "ASME BTH-1 §3-2.3" });
    add({ grp: "Pasadores de empuje", sys: "est", kind: "info", name: "Empotramiento disponible en el anillo / empotramiento perfecto (no se considera)", formula: "M_e = (σ_adm − V/(d·t))·d·t²/6; M_emp = F_r(3L² − c²)/(24L)", dem: Me / Mfix, unit: "–", ref: "Modelo del pasador" });
    add({ grp: "Pasadores de empuje", sys: "est", name: "Corte en el apoyo", formula: "τ = 4V/(3A), V = F_r·(1/2 + e/L) ≤ Fy/(Nd·√3)", dem: 4 * Vp * 1e3 / (3 * Ap), cap: P.Fy_pin / (Nd * Math.sqrt(3)), unit: "MPa", ref: "ASME BTH-1 §3-2.2" });
    add({ grp: "Pasadores de empuje", sys: "est", name: "Aplastamiento en el agujero del anillo", formula: "σ = V/(d·t) ≤ 1,25Fy/Nd", dem: sV, cap: sbA, unit: "MPa", ref: "ASME BTH-1 §3-3.3 (aplastamiento en pasadores)" });
    add({ grp: "Pasadores de empuje", sys: "est", name: "Aplastamiento pasador–uña", formula: "σ = F/(d·h_uña) ≤ 1,25·Fy_mín/Nd", dem: Fs * 1e3 / (P.d_pin * P.dog_h), cap: 1.25 * Math.min(P.Fy_pin, P.Fy_dog) / Nd, unit: "MPa", ref: "ASME BTH-1 §3-3.3" });

    /* --- Uña (cara de empuje plana, templada) --- */
    const Adog = P.dog_b * P.dog_h, Hs = P.mu_s * Fs;                  // fricción radial máxima en la cara (a calado)
    const lev = K.lever + P.e_dog, Sdog = P.dog_h * P.dog_b ** 2 / 6;
    add({ grp: "Uña", sys: "est", name: "Flexión en la boca del patín (voladizo) con fricción radial", formula: "σ = [F·(x_boca − a_mín + e) + μ_s·F·b/2]/(h·b²/6) + μ_s·F/(h·b) ≤ Fy/Nd", dem: (Fs * lev + Hs * P.dog_b / 2) * 1e3 / Sdog + Hs * 1e3 / Adog, cap: P.Fy_dog / Nd, unit: "MPa", ref: "ASME BTH-1 §3-2.3" });
    add({ grp: "Uña", sys: "est", name: "Corte en la boca del patín", formula: "τ = 1,5·F/(h·b) ≤ Fy/(Nd·√3)", dem: 1.5 * Fs * 1e3 / Adog, cap: P.Fy_dog / (Nd * Math.sqrt(3)), unit: "MPa", ref: "ASME BTH-1 §3-2.2" });
    const Es = P.E / (2 * (1 - P.nu ** 2)), rp = P.d_pin / 2;
    const qE = P.k_edge * Fs * 1e3 / P.dog_h;                          // carga lineal máxima (borde de la cara)
    const p0 = Math.sqrt(qE * Es / (Math.PI * rp)), bH = Math.sqrt(4 * qE * rp / (Math.PI * Es));
    add({ grp: "Uña", sys: "est", name: "Contacto de Hertz cara plana–pasador (a calado; ambas caras templadas)", formula: "p₀ = √(q·E*/(π·r)), q = k_borde·F/h, E* = E/(2(1−ν²)) ≤ 1,67·Fy_sup (cara con alivio de borde)", dem: p0, cap: 1.67 * P.Fy_surf, unit: "MPa", ref: "Hertz, contacto lineal; inicio de fluencia por Tresca (p₀ = 1,67σy)" });
    add({ grp: "Uña", sys: "est", kind: "info", name: "Profundidad mínima de temple (3 × profundidad del corte máximo)", formula: "z = 3·0,78·b, b = √(4q·r/(π·E*))", dem: 3 * 0.78 * bH, unit: "mm", ref: "Hertz, contacto lineal" });
    const ch = chamferGeo(P);
    add({ grp: "Uña", sys: "est", kind: "geo", name: "Chaflán de retorno: cabe en la uña dejando la punta", formula: "Δy = recorrido/tan β; Δy + b_punta ≤ b_uña", dem: ch.dy + P.b_tip, cap: P.dog_b, unit: "mm", ref: "Geometría (retorno del trinquete)" });
    // flexión y corte en la zona del chaflán: ancho w(u) = b − Δy·(1 − u/Δx), u medido desde la punta; carga en u = c_punta
    let sChMax = 0;
    for (let i = 1; i <= 40; i++) { const u = P.c_tip + (ch.dx - P.c_tip) * i / 40, w = P.dog_b - ch.dy * Math.max(0, 1 - u / ch.dx); sChMax = Math.max(sChMax, 6 * Fs * 1e3 * (u - P.c_tip) / (P.dog_h * w * w)); }
    const wC = P.dog_b - ch.dy * Math.max(0, 1 - P.c_tip / ch.dx);
    add({ grp: "Uña", sys: "est", name: "Corte en la sección del contacto (punta achaflanada)", formula: "τ = 1,5·F/(h·w_c), w_c = b − Δy(1 − c_punta/Δx) ≤ Fy/(Nd·√3)", dem: 1.5 * Fs * 1e3 / (P.dog_h * wC), cap: P.Fy_dog / (Nd * Math.sqrt(3)), unit: "MPa", ref: "ASME BTH-1 §3-2.2" });
    add({ grp: "Uña", sys: "est", name: "Flexión en la zona del chaflán", formula: "σ = máx 6F(x − a)/(h·w(x)²) ≤ Fy/Nd", dem: sChMax, cap: P.Fy_dog / Nd, unit: "MPa", ref: "ASME BTH-1 §3-2.3" });
    const bR = P.beta_ch * Math.PI / 180, mr = P.mu_ret, kR = 1 + 2 * Math.max(0, K.mouthX - (K.tipX + ch.dx / 2)) / P.L_in;
    add({ grp: "Giro", sys: "giro", name: "Retorno sin autobloqueo de la uña (chaflán contra el pasador siguiente)", formula: "μ·k·(sin β + μ cos β) < cos β − μ sin β, k = 1 + 2·l/L_in", dem: mr * kR * (Math.sin(bR) + mr * Math.cos(bR)), cap: Math.cos(bR) - mr * Math.sin(bR), unit: "–", ref: "Equilibrio con fricción del trinquete" });

    /* --- Patín: alojamiento de la uña --- */
    const lL = lev, cL = -lL + Math.sqrt(lL * lL + lL * P.L_in + P.L_in ** 2 / 2), sLip = Fs * 1e3 / (P.dog_h * (2 * cL - P.L_in));
    add({ grp: "Patín y guía", sys: "est", name: "Aplastamiento del alojamiento de la uña (bloque rígido-plástico)", formula: "c = −l + √(l² + l·L_in + L_in²/2); σ = F/(h·(2c − L_in)) ≤ 1,25Fy_patín/Nd", dem: sLip, cap: 1.25 * P.Fy_shoe / Nd, unit: "MPa", ref: "ASME BTH-1 §3-2.5 (aplastamiento)" });
    if (K.inset > 0) {
      const Vw = sLip * P.dog_h * Math.min(K.inset, cL) / 1e3, Hw = P.dog_h + 20;
      add({ grp: "Patín y guía", sys: "est", name: "Pared del marco de boca: flexión (voladizo del marco)", formula: "σ = 6V·(i/2)/((h+20)·t²), V = σ_al·h·mín(i, c)", dem: 6 * Vw * 1e3 * K.inset / 2 / (Hw * P.t_fw ** 2), cap: P.Fy_shoe / Nd, unit: "MPa", ref: "ASME BTH-1 §3-2.3" });
      add({ grp: "Patín y guía", sys: "est", name: "Pared del marco de boca: corte", formula: "τ = 1,5V/((h+20)·t) ≤ Fy/(Nd·√3)", dem: 1.5 * Vw * 1e3 / (Hw * P.t_fw), cap: P.Fy_shoe / (Nd * Math.sqrt(3)), unit: "MPa", ref: "ASME BTH-1 §3-2.2" });
    }

    /* --- Patín y bancada (reacciones de guía con fricción radial, a calado) --- */
    const Rg = R.Rguide, qG = 4 * Rg * 1e3 / K.L_s;                   // presión lineal máxima (distribución triangular por mitad)
    add({ grp: "Patín y guía", sys: "est", name: "Aplastamiento de la lengüeta en la ranura (pico de la distribución lineal)", formula: "R = máx[F_pas·Δ + H·(y_c − y_r)]/Lg; σ = 4R/((h_ranura − 2)·L_patín) ≤ 1,25Fy/Nd", dem: qG / (P.h_slot - 2), cap: 1.25 * Fy / Nd, unit: "MPa", ref: "ASME BTH-1 §3-2.5" });
    const tRoot = (P.w_bed - Math.max(P.w_slot, P.h_tee > 0 ? P.w_tee : 0)) / 2;
    const armW = P.h_tee + P.h_slot / 2 + 1;                           // del centroide del contacto en el cuello a la raíz (fondo de la cabeza T)
    add({ grp: "Patín y guía", sys: "est", name: "Pared de la ranura: flexión en la raíz", formula: "σ = 6·(4R/L_patín)·(h_T + h_ranura/2 + 1)/t_raíz², t_raíz = (w_b − w_T)/2 ≤ Fy/Nd", dem: 6 * qG * armW / tRoot ** 2, cap: Fy / Nd, unit: "MPa", ref: "ASME BTH-1 §3-2.3" });
    add({ grp: "Patín y guía", sys: "est", kind: "geo", name: "Fondo de la ranura de la bancada", formula: "t_bancada − h_ranura − h_T ≥ 12", dem: 12, cap: P.t_bed - P.h_slot - P.h_tee, unit: "mm", ref: "Criterio de fabricación (la bancada trabaja como una pieza)" });
    const Leff = Math.min(K.L_bed, K.L_s + 2 * P.w_bed), awb = 0.707 * P.w_bed_f;
    add({ grp: "Patín y guía", sys: "est", name: "Soldadura bancada–base (2 filetes longitudinales)", formula: "f = R/(2·0,707·w·L_ef), L_ef = L_patín + 2·w_bancada", dem: Rg * 1e3 / (2 * awb * Leff), cap: Fw, unit: "MPa", ref: "ASME BTH-1 §3-3.4" });
    // retención vertical: vuelco por la fricción radial H (eje x) y cabeceo por la fricción de guía (eje y), brazo z_eje − z_lengüeta
    const zT = P.t_base + P.t_bed - P.h_slot / 2, dz = K.zc0 - zT, SM = R.stallMax;
    const Mroll = SM.H * dz / 1e3, Mpitch = P.mu_g * SM.Rsum * dz / 1e3;          // kN·m
    const Vup = Mroll * 1e3 / ((P.w_bed + P.w_tee) / 2) + Mpitch * 1e3 / K.L_s;      // kN
    if (P.h_tee > 0) {
      const ov = (P.w_tee - P.w_slot) / 2;
      add({ grp: "Patín y guía", sys: "est", kind: "geo", name: "Ranura T: cabeza más ancha que el cuello", formula: "w_T ≥ w_ranura + 2·8", dem: P.w_slot + 16, cap: P.w_tee, unit: "mm", ref: "Geometría" });
      add({ grp: "Patín y guía", sys: "est", name: "Retención vertical del patín: aplastamiento en la cabeza T", formula: "V = M_vuelco/((w_b + w_T)/2) + M_cabeceo/L_patín; σ = V/(ala·L_patín) ≤ 1,25Fy/Nd", dem: Vup * 1e3 / (ov * K.L_s), cap: 1.25 * Fy / Nd, unit: "MPa", ref: "ASME BTH-1 §3-2.5" });
      add({ grp: "Patín y guía", sys: "est", name: "Retención vertical: flexión del ala de la cabeza T", formula: "σ = 6V·(ala/2)/(L_patín·h_T²) ≤ Fy/Nd", dem: 6 * Vup * 1e3 * ov / 2 / (K.L_s * P.h_tee ** 2), cap: Fy / Nd, unit: "MPa", ref: "ASME BTH-1 §3-2.3" });
      add({ grp: "Patín y guía", sys: "est", name: "Retención vertical: flexión del labio de la bancada sobre la cabeza T", formula: "σ = 6V·(ala/2)/(L_patín·h_ranura²) ≤ Fy/Nd", dem: 6 * Vup * 1e3 * ov / 2 / (K.L_s * P.h_slot ** 2), cap: Fy / Nd, unit: "MPa", ref: "ASME BTH-1 §3-2.3" });
    } else {
      const Wsh = R.m.shoes / P.n_cyl * G / 1e3;
      add({ grp: "Patín y guía", sys: "est", name: "Patín sin retención vertical: vuelco frente al peso propio", formula: "M_vuelco = H·Δz ≤ W_patín·w_bancada/2 (requiere ranura T)", dem: Mroll, cap: Wsh * P.w_bed / 2 / 1e3, unit: "kN·m", ref: "Equilibrio (revisión independiente H2)" });
    }
    add({ grp: "Patín y guía", sys: "est", kind: "info", name: "Factor de guía equivalente K = F_cil·n·a_mín/T (máximo en la carrera)", formula: "incluye μg en la guía y μ_s en la cara de la uña", dem: R.Kguide, unit: "–", ref: "Equilibrio del patín" });

    /* --- Articulaciones (ojal en la base y pasador del vástago) --- */
    const App = Math.PI * P.d_pp ** 2 / 4, Spp = Math.PI * P.d_pp ** 3 / 32;
    const Mpp = Fs / 2 * (P.t_ch / 2 + P.g_ch + P.b_eye / 4) / 1e3;
    add({ grp: "Articulaciones", sys: "est", name: "Pasador: flexión (horquilla)", formula: "M = F/2·(t/2 + g + b/4); σ ≤ Fy/Nd", dem: Mpp * 1e6 / Spp, cap: P.Fy_pp / Nd, unit: "MPa", ref: "ASME BTH-1 §3-3.3 / 3-2.3" });
    add({ grp: "Articulaciones", sys: "est", name: "Pasador: corte doble", formula: "τ = (F/2)/A ≤ Fy/(Nd·√3)", dem: Fs / 2 * 1e3 / App, cap: P.Fy_pp / (Nd * Math.sqrt(3)), unit: "MPa", ref: "ASME BTH-1 §3-2.2" });
    add({ grp: "Articulaciones", sys: "est", name: "Aplastamiento en mejillas", formula: "σ = (F/2)/(d·t) ≤ 1,25Fy/Nd", dem: Fs / 2 * 1e3 / (P.d_pp * P.t_ch), cap: 1.25 * Fy / Nd, unit: "MPa", ref: "ASME BTH-1 §3-3.3" });
    const bgx = bracketGeo(P), aSh = bgx.rear - P.d_pp / 2;

      <div class="note">● alternativa activa. Disco inoxidable: placa circular empotrada sobre un vacío local de Ø${fmt(P.ss_void, 3)} mm bajo q = ${fmt(A.R.q_max)} MPa, σ = 3qa²/(4t²) ≤ 0,6·Fy (${fmt(P.Fy_ss, 3)} MPa), más ${fmt(P.ss_allow)} mm de sobreespesor; mínimo constructivo ${fmt(P.ss_tmin)} mm. Lámina UHMW: t ≥ E_c(S)·δ/(p_adm − q), con el módulo E_c aumentado por el factor de forma de la lámina delgada (E = ${fmt(P.E_uhmw, 3)} MPa, δ = ${fmt(P.d_flat)} mm en una ventana de Ø${fmt(P.ss_void, 3)} mm, p_adm = ${fmt(P.p_uhmw)} MPa; mínimo constructivo ${fmt(P.uh_tmin)} mm). La Δ de masa total incluye el crecimiento de ménsulas, patines y pivote por la altura agregada. Los μ de cada alternativa son datos de entrada: confirmarlos con ensayo del proveedor. Al activar A o B el eje de los cilindros sube la altura agregada.</div>`;

  /* ---------- Modelo: planta y corte ---------- */
  function planSVG() {
    const R = A.R, K = R.K, B = P.B, S = B / 2 + 160;
    const y = (v) => -v;
    const o = [];
    o.push(`<rect x="${-B / 2}" y="${-B / 2}" width="${B}" height="${B}" fill="var(--soft)" stroke="var(--steel)" stroke-width="4"/>`);
    if (P.rim_t > 0) o.push(`<rect x="${-B / 2 + P.rim_t / 2}" y="${-B / 2 + P.rim_t / 2}" width="${B - P.rim_t}" height="${B - P.rim_t}" fill="none" stroke="var(--steel)" stroke-width="${P.rim_t}" opacity=".6"/>`);
    const Rt = P.D_top / 2;
    o.push(`<circle r="${Rt}" fill="var(--panel)" stroke="var(--ink)" stroke-width="5"/>`);
    o.push(`<circle r="${TT.prIn(P)}" fill="none" stroke="var(--steel)" stroke-width="2" stroke-dasharray="14 10"/>`);
    TT.parseRings(P.rings).forEach((r) => o.push(`<circle r="${r}" fill="none" stroke="var(--steel)" stroke-width="${Math.max(3, P.t_web)}" stroke-dasharray="20 12" opacity=".8"/>`));
    for (let k = 0; k < P.N_rib; k++) { const a = 2 * Math.PI * k / P.N_rib; o.push(`<line x1="${P.D_hub / 2 * Math.cos(a)}" y1="${y(P.D_hub / 2 * Math.sin(a))}" x2="${P.R_rib * Math.cos(a)}" y2="${y(P.R_rib * Math.sin(a))}" stroke="var(--steel)" stroke-width="${Math.max(3, P.t_rib)}" stroke-dasharray="20 12" opacity=".8"/>`); }
    o.push(`<circle r="${P.D_hub / 2}" fill="none" stroke="var(--steel)" stroke-width="4"/><circle r="${P.D_piv / 2}" fill="var(--steel)" opacity=".5"/>`);
    for (let k = 0; k < P.N_pin; k++) { const a = Math.PI / P.N_pin + 2 * Math.PI * k / P.N_pin; o.push(`<circle cx="${P.R_pin * Math.cos(a)}" cy="${y(P.R_pin * Math.sin(a))}" r="${P.d_pin / 2}" fill="var(--ink2)"/>`); }
    // cáncamos
    [[1, 1], [-1, 1], [1, -1], [-1, -1]].forEach(([sx, sy]) => o.push(`<rect x="${sx * P.x_lug - 40}" y="${sy * (B / 2 - P.c_lug) - 40}" width="80" height="80" rx="14" fill="none" stroke="var(--ink2)" stroke-width="4"/>`));
    // accionamiento guiado: bancadas, ménsulas (ambos sentidos), patines, uñas y cilindros (sentido antihorario)
    const g = K, bg = TT.bracketGeo(P);
    for (const sx of [1, -1]) {
      const X = sx * P.x_g;
      o.push(`<rect x="${X - P.w_bed / 2}" y="${-g.Y_bed}" width="${P.w_bed}" height="${2 * g.Y_bed}" fill="var(--soft)" stroke="var(--steel)" stroke-width="3"/>`);
      o.push(`<line x1="${X}" y1="${-g.Y_bed}" x2="${X}" y2="${g.Y_bed}" stroke="var(--steel)" stroke-width="${P.w_slot}" opacity=".35"/>`);
      for (const dy of [1, -1]) {
        const act = sx * dy > 0, op = act ? 1 : 0.35, Ye = dy * g.y_eye;
        o.push(`<g opacity="${op}"><rect x="${X - bg.Wout / 2}" y="${y(Ye + dy * (P.L_ch - bg.rear)) - (dy > 0 ? 0 : 0)}" width="${bg.Wout}" height="${P.L_ch}" transform="translate(0 ${dy > 0 ? 0 : -P.L_ch})" fill="none" stroke="var(--ink)" stroke-width="5"/>
          <circle cx="${X}" cy="${y(Ye)}" r="${P.d_pp / 2}" fill="var(--ink)"/></g>`);
        if (!act) continue;
        const yr = dy * (g.y_rp0 + P.s_free), yb0 = Ye + dy * P.e_body, yb1 = dy * (g.y_rp0 - P.c_rod);
        o.push(`<rect x="${X - P.D_body / 2}" y="${Math.min(y(yb0), y(yb1))}" width="${P.D_body}" height="${Math.abs(yb1 - yb0)}" fill="var(--acc)" opacity=".55"/>`);
        o.push(`<rect x="${X - P.d_rod / 2}" y="${Math.min(y(yb1), y(yr))}" width="${P.d_rod}" height="${Math.abs(yr - yb1)}" fill="var(--acc)"/>`);
        const ys0 = yr - dy * g.rear, ys1 = yr + dy * g.front;
        o.push(`<rect x="${X - P.w_s / 2}" y="${Math.min(y(ys0), y(ys1))}" width="${P.w_s}" height="${g.L_s}" fill="var(--panel)" stroke="var(--ink)" stroke-width="5"/>`);
        o.push(`<circle cx="${X}" cy="${y(yr)}" r="${P.d_pp / 2}" fill="var(--panel)" stroke="var(--ink)" stroke-width="4"/>`);
        const yp = dy * (-P.R_pin * Math.sin(g.pitch / 2)), xm = sx * g.mouthX, xa = sx * g.a_min, xt = sx * g.tipX;
        // uña de cara plana (en contacto con la superficie del pasador), con el chaflán de retorno en la arista punta–cara trasera
        const ch = TT.chamferGeo(P), yf = yp - dy * P.d_pin / 2, ybk = yf - dy * P.dog_b;
        const pts = [[xt, yf], [xm, yf], [xm, ybk], [xt + sx * ch.dx, ybk], [xt, ybk + dy * Math.min(ch.dy, P.dog_b)]].map(([a, b]) => `${a},${y(b)}`).join(" ");
        o.push(`<polygon points="${pts}" fill="var(--load)" opacity=".85"/>`);
        o.push(`<circle cx="${xa}" cy="${y(yp)}" r="${P.d_pin / 2 + 6}" fill="none" stroke="var(--load)" stroke-width="8"/>`);
        if (sx > 0) {
          o.push(`<line x1="0" y1="0" x2="${xa}" y2="0" stroke="var(--load)" stroke-width="3"/><text x="${xa / 2}" y="-14" font-size="44" text-anchor="middle" fill="var(--load)">brazo ${fmt(g.a_min, 3)} mm</text>`);
          o.push(`<line x1="${xa}" y1="${y(yp)}" x2="${X}" y2="${y(yp)}" stroke="var(--load)" stroke-width="3" stroke-dasharray="14 10"/><text x="${(xa + X) / 2}" y="${y(yp) + (dy > 0 ? 60 : -30)}" font-size="40" text-anchor="middle" fill="var(--load)">Δ ${fmt(g.DeltaMax, 3)}</text>`);
        }
      }
    }
    o.push(`<text x="0" y="${-B / 2 - 50}" text-anchor="middle" font-size="52">Base ${fmt(B, 4)} × ${fmt(B, 4)} · mesa Ø${fmt(P.D_top, 4)} · ${P.N_pin} pasadores Ø${fmt(P.d_pin)} en R${fmt(P.R_pin, 4)}</text>`);
    o.push(`<text x="0" y="${B / 2 + 90}" text-anchor="middle" font-size="44" fill="var(--ink2)">Cilindros y patines al tomar el pasador · giro antihorario (ménsulas tenues: giro horario)</text>`);
    return `<svg viewBox="${-S} ${-S} ${2 * S} ${2 * S + 40}" role="img" aria-label="Planta de la tornamesa">${o.join("")}</svg>`;
  }
  function sectionSVG() {
    const R = A.R, tb = P.t_base, hd = P.h_disc, tpr = Math.max(P.t_pr, P.t_top, P.t_bot), ifc = R.ifc, dl = ifc.delta, tm = tb + dl;   // tm: cara inferior de la mesa (sobre los discos de la interfaz)
    const r0 = TT.prIn(P) - 220, r1 = P.B / 2 + 40, W = r1 - r0, Hs = tm + hd + 160;
    const sc = 1, X = (r) => (r - r0) * sc, Z = (z) => (Hs - 40 - z) * sc;

    o.push(`<rect x="${X(rpr)}" y="${Z(tm + hd)}" width="${X(Rt) - X(rpr)}" height="${tpr}" fill="var(--ink2)"/>`);
    TT.parseRings(P.rings).filter((r) => r > r0).forEach((r) => o.push(`<rect x="${X(r - P.t_web / 2)}" y="${Z(tm + hd - P.t_top)}" width="${P.t_web}" height="${hd - P.t_top - P.t_bot}" fill="var(--ink2)" opacity=".75"/>`));
    o.push(`<rect x="${X(P.R_pin - P.d_pin / 2)}" y="${Z(tm + hd)}" width="${P.d_pin}" height="${hd}" fill="var(--panel)" stroke="var(--ink)" stroke-width="2"/>`);
    const zc = tb + R.hax;
    o.push(`<line x1="${X(r0)}" y1="${Z(zc)}" x2="${X(r1)}" y2="${Z(zc)}" stroke="var(--load)" stroke-width="1.5" stroke-dasharray="10 6"/>`);
    const K = A.R.K, zb = tb + P.t_bed, fh = TT.forkH(P);
    o.push(`<rect x="${X(P.x_g - P.w_bed / 2)}" y="${Z(zb)}" width="${P.w_bed}" height="${P.t_bed}" fill="var(--steel)" opacity=".8"/>`);
    o.push(`<rect x="${X(P.x_g - P.w_slot / 2)}" y="${Z(zb)}" width="${P.w_slot}" height="${P.h_slot}" fill="var(--panel)"/>`);
    if (P.h_tee > 0) o.push(`<rect x="${X(P.x_g - P.w_tee / 2)}" y="${Z(zb - P.h_slot)}" width="${P.w_tee}" height="${P.h_tee}" fill="var(--panel)"/>`);
    o.push(`<rect x="${X(P.x_g - P.w_s / 2)}" y="${Z(zc + fh / 2)}" width="${P.w_s}" height="${zc + fh / 2 - zb}" fill="var(--panel)" stroke="var(--ink)" stroke-width="2"/>`);
    o.push(`<rect x="${X(P.x_g - P.w_slot / 2 + 1)}" y="${Z(zb)}" width="${P.w_slot - 2}" height="${P.h_slot - 2}" fill="var(--ink2)"/>`);
    if (P.h_tee > 0) o.push(`<rect x="${X(P.x_g - P.w_tee / 2 + 1)}" y="${Z(zb - P.h_slot + 1)}" width="${P.w_tee - 2}" height="${P.h_tee - 2}" fill="var(--ink2)"/>`);
    o.push(`<rect x="${X(K.mouthX)}" y="${Z(zc + P.dog_h / 2 + 10)}" width="${P.x_g - P.w_s / 2 - K.mouthX}" height="${P.dog_h + 20}" fill="none" stroke="var(--ink)" stroke-width="2"/>`);
    o.push(`<rect x="${X(K.tipX)}" y="${Z(zc + P.dog_h / 2)}" width="${K.mouthX + P.L_in - K.tipX}" height="${P.dog_h}" fill="var(--load)" opacity=".75"/>`);
    o.push(`<line x1="${X(P.x_g)}" y1="${Z(tb)}" x2="${X(P.x_g)}" y2="${Z(zc + fh / 2 + 20)}" stroke="var(--ink2)" stroke-dasharray="8 5"/>`);
    const dim = (r, z0, z1, txt, side) => `<line x1="${X(r)}" y1="${Z(z0)}" x2="${X(r)}" y2="${Z(z1)}" stroke="var(--ink)" stroke-width="1"/><text x="${X(r) + (side || 6)}" y="${(Z(z0) + Z(z1)) / 2 + 4}" font-size="13" ${side < 0 ? 'text-anchor="end"' : ""}>${txt}</text>`;
    o.push(dim(r0 + 8, tm, tm + hd, `h ${fmt(hd, 3)}`, 6));
    o.push(dim(r0 + 110, 0, tb, `base ${fmt(tb)}`, 6));
    o.push(dim(P.R_pin, tm + tpr, tm + hd - tpr, `libre ${fmt(TT.pinClear(P))}`, -P.d_pin / 2 - 8));
    o.push(`<text x="${X(Rt) + 8}" y="${Z(tm + hd) + 14}" font-size="13">anillo ${fmt(tpr)}</text>`);
    o.push(`<text x="${X(r0) + 4}" y="${Z(tm + hd) - 8}" font-size="13">sup. ${fmt(P.t_top)} · inf. ${fmt(P.t_bot)} · almas ${fmt(P.t_web)}</text>`);
    o.push(`<text x="${X(r1) - 4}" y="${Z(zc) - 6}" font-size="13" text-anchor="end" fill="var(--load)">eje cilindro +${fmt(R.hax)}</text>`);
    o.push(`<text x="${X(P.R_pin)}" y="${Z(-10) + 22}" font-size="13" text-anchor="middle">R${fmt(P.R_pin, 4)}</text>`);
    return `<svg viewBox="0 0 ${W} ${Hs + 20}" role="img" aria-label="Corte radial en el borde">${o.join("")}</svg>`;
  }

  /* ---------- Accionamiento ---------- */
  function lineChart(series, opt) {
    const Wd = 640, Hd = 300, m = { l: 56, r: 16, t: 14, b: 38 };
    const xs = series.flatMap((s) => s.pts.map((p) => p[0])).concat(opt.xs || []);
    const ys = series.flatMap((s) => s.pts.map((p) => p[1])).concat(opt.ys || []);
    const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = 0, y1 = Math.max(...ys) * 1.08;
    const X = (v) => m.l + (v - x0) / (x1 - x0 || 1) * (Wd - m.l - m.r), Y = (v) => Hd - m.b - (v - y0) / (y1 - y0 || 1) * (Hd - m.t - m.b);
    const o = [];
    for (let i = 0; i <= 5; i++) { const v = y0 + (y1 - y0) * i / 5; o.push(`<line x1="${m.l}" x2="${Wd - m.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${m.l - 6}" y="${Y(v) + 4}" font-size="11" text-anchor="end">${fmt(v, 3)}</text>`); }
    for (let i = 0; i <= 5; i++) { const v = x0 + (x1 - x0) * i / 5; o.push(`<text x="${X(v)}" y="${Hd - m.b + 16}" font-size="11" text-anchor="middle">${fmt(v, 3)}</text>`); }
    (opt.hl || []).forEach((h) => o.push(`<line x1="${m.l}" x2="${Wd - m.r}" y1="${Y(h.v)}" y2="${Y(h.v)}" stroke="${h.c}" stroke-dasharray="6 4" stroke-width="1.5"/><text x="${Wd - m.r - 4}" y="${Y(h.v) - 5}" font-size="11" text-anchor="end" fill="${h.c}">${h.t}</text>`));
    (opt.vl || []).forEach((h) => o.push(`<line y1="${m.t}" y2="${Hd - m.b}" x1="${X(h.v)}" x2="${X(h.v)}" stroke="${h.c}" stroke-dasharray="6 4" stroke-width="1.5"/><text x="${X(h.v) - 4}" y="${Hd - m.b - 6}" font-size="11" text-anchor="end" fill="${h.c}">${h.t}</text>`));
    series.forEach((s) => o.push(`<polyline fill="none" stroke="${s.c}" stroke-width="2" points="${s.pts.map((p) => X(p[0]) + "," + Y(p[1])).join(" ")}"/>`));
    o.push(`<text x="${(m.l + Wd - m.r) / 2}" y="${Hd - 6}" font-size="12" text-anchor="middle">${opt.xl}</text><text x="12" y="${(m.t + Hd - m.b) / 2}" font-size="12" text-anchor="middle" transform="rotate(-90 12 ${(m.t + Hd - m.b) / 2})">${opt.yl}</text>`);
    const leg = series.map((s, i) => `<span style="display:inline-flex;align-items:center;gap:5px;margin-right:12px"><i style="width:16px;height:3px;background:${s.c};display:inline-block"></i>${s.n}</span>`).join("");
    return `<svg viewBox="0 0 ${Wd} ${Hd}" role="img" aria-label="${opt.yl} vs ${opt.xl}">${o.join("")}</svg><div class="note">${leg}</div>`;
  }
  function renderGiro() {
    const el = document.querySelector('section[data-t="giro"]');
    if (!A) { el.innerHTML = msgs(); return; }
    const R = A.R, K = R.K;
    const ser = [["nom", "Nominal", "var(--ok)"], ["dis", "Diseño", "var(--acc)"], ["cont", "Contaminado (μ·r = " + fmt(R.mu.cont * P.r_ef / 1000) + " m)", "var(--warn)"], ["borde", "Borde (μ·r = " + fmt(R.mu.d * P.D_top / 2000) + " m)", "var(--fail)"]].map(([id, n, c]) => {
      const cs = R.cases.find((x) => x.id === id);
